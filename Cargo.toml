# The crate manifest of the ONDEWO S2T rust client.
#
# It is ALSO the gen_crate template of the ondewo-rust-proto-compiler image: `make
# generate_ondewo_protos` mounts it into the container, protoc-gen-prost-crate copies it
# verbatim (no_features) to the generated crate, and the orchestrator copies it back here.
# A round trip therefore leaves this file unchanged - but every dependency named below has
# to exist in the image's pre-warmed cargo cache, because generation runs fully offline
# (CARGO_NET_OFFLINE=true + `cargo build --offline`). Adding one means adding it to
# ondewo-proto-compiler/rust/image-data/default-lib-files/prewarm-Cargo.toml and rebuilding
# the image; the build otherwise fails loudly in compile-stubs-2-lib.sh's pre-flight.
#
# The version is set by `make update_cargo_version` from ONDEWO_S2T_VERSION in
# the Makefile - do not edit it by hand.
[package]
name = "ondewo-s2t-client"
version = "7.5.1"
edition = "2021"
rust-version = "1.88"
description = "ONDEWO S2T (Speech-to-Text) gRPC client library, generated from the ondewo-s2t-api protocol buffer definitions"
authors = ["ONDEWO GmbH <office@ondewo.com>"]
license = "Apache-2.0"
repository = "https://github.com/ondewo/ondewo-s2t-client-rust"
homepage = "https://ondewo.com"
documentation = "https://docs.rs/ondewo-s2t-client"
readme = "README.md"
keywords = ["ondewo", "grpc", "tonic", "protobuf", "s2t"]
categories = ["api-bindings", "network-programming"]

# Keep the published crate to the library itself: the two submodules are large, are not
# needed to compile the stubs, and `cargo package` would otherwise pull them in.
exclude = [
  "ondewo-s2t-api/",
  "ondewo-proto-compiler/",
  "crate-dist/",
  ".proto-input/",
  ".github/",
]

[lib]
path = "src/lib.rs"
# The ONDEWO protos document their RPCs with INDENTED blocks (proto snippets, HTTP mappings), and
# prost copies those comments verbatim into doc comments. rustdoc reads an indented block as a rust
# doctest, so `cargo test` tries to compile them and fails. Nothing in src/api is a runnable
# example, so doctests are off for the library; the hand-written usage snippet lives in examples/
# instead, where `cargo test` still compiles it.
doctest = false

[dependencies]
prost = "0.14"
prost-types = "0.14"
# Since tonic 0.14 the prost codec lives in its own crate and protoc-gen-tonic emits
# `tonic_prost::ProstCodec`; without tonic-prost every generated service fails to resolve.
# tls-native-roots: a TLS channel without a custom CA (grpc_cert) trusts the platform's
# certificate store (src/channel.rs). It pulls in rustls-native-certs, which the compiler image
# pre-warms from ondewo-proto-compiler 5.15.4 on: an older image fails the offline
# `make generate_ondewo_protos`.
tonic = { version = "0.14", features = ["tls-ring", "tls-native-roots", "gzip"] }
tonic-prost = "0.14"
# The insecure-channel warning of src/channel.rs. Already a dependency of tonic.
tracing = "0.1"

# Test-only. The integration suite serves the GENERATED server trait over a real loopback
# socket and calls it with the GENERATED client, which needs an async runtime. Both crates are
# already in the compiler image's pre-warmed cache (see prewarm-Cargo.toml), so adding them
# keeps the fully offline `make generate_ondewo_protos` round trip working.
[dev-dependencies]
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
